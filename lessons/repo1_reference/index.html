<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signal Explainer, Repo 1</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Signal Explainer</h1>
    <p class="subtitle">Repo 1, Generative AI in Finance, Day 1 afternoon build</p>
  </header>

  <main class="app-main">
    <section class="panel">
      <form id="signal-form">
        <div class="field-row">
          <div class="field">
            <label for="ticker">Ticker</label>
            <input id="ticker" name="ticker" type="text" placeholder="e.g. AAPL" required />
          </div>
          <div class="field">
            <label for="ma-fast">Fast window (days)</label>
            <input id="ma-fast" name="ma-fast" type="number" min="2" value="12" required />
          </div>
          <div class="field">
            <label for="ma-slow">Slow window (days)</label>
            <input id="ma-slow" name="ma-slow" type="number" min="3" value="26" required />
          </div>
          <div class="field">
            <label for="rsi-period">RSI period (days)</label>
            <input id="rsi-period" name="rsi-period" type="number" min="2" value="14" required />
          </div>
        </div>

        <div class="field">
          <label for="fmp-key">Financial Modeling Prep API key</label>
          <input id="fmp-key" name="fmp-key" type="password" placeholder="FMP key" required />
        </div>

        <div class="field">
          <label for="openrouter-key">OpenRouter API key</label>
          <input id="openrouter-key" name="openrouter-key" type="password" placeholder="sk-or-..." required />
        </div>

        <button type="submit">Analyze</button>
        <p class="status" id="status"></p>
      </form>
    </section>

    <section class="panel charts">
      <div class="chart-block">
        <h2>Moving average crossover</h2>
        <canvas id="ma-chart"></canvas>
      </div>
      <div class="chart-block">
        <h2>MACD</h2>
        <canvas id="macd-chart"></canvas>
      </div>
      <div class="chart-block">
        <h2>RSI</h2>
        <canvas id="rsi-chart"></canvas>
      </div>
    </section>

    <section class="panel" id="research-note">
      <p class="placeholder">Your research note will appear here once you run an analysis.</p>
    </section>
  </main>

  <footer class="app-footer">
    <p>Starting point for Repo 1. Extend this with your own investment thesis in Repo 2 and Repo 3.</p>
  </footer>

  <script type="module" src="/main.js"></script>
</body>
</html>
